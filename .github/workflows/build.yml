name: Build WorkSlop Desktop

on:
  workflow_dispatch:
    inputs:
      build_for_macos_intel:
        description: 'Build macOS Intel'
        required: false
        default: true
        type: boolean
      build_for_macos_intel_legacy:
        description: 'Build macOS Intel (legacy: macOS 12 min)'
        required: false
        default: false
        type: boolean
      build_for_macos_arm:
        description: 'Build macOS ARM'
        required: false
        default: true
        type: boolean
      build_for_windows:
        description: 'Build Windows'
        required: false
        default: true
        type: boolean
      build_for_linux:
        description: 'Build Linux'
        required: false
        default: true
        type: boolean
      build_for_arm_linux:
        description: 'Build Linux ARM'
        required: false
        default: true
        type: boolean
  push:
    branches: [main, release, wave10-dev]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-macos-intel:
    if: ${{ github.event_name == 'push' || github.event.inputs.build_for_macos_intel == 'true' }}
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Create venv and install requirements
        run: |
          python3 -m venv .env
          source .env/bin/activate
          python -m pip install -U pip setuptools wheel
          pip install --no-binary sslpsk_pmd3 -r requirements.txt

      - name: Run offscreen tests
        run: |
          source .env/bin/activate
          python3 tools/run_offscreen_tests.py

      - name: Build zsign (sideload signing)
        run: python3 tools/build_zsign.py

      - name: Build macOS Intel
        run: |
          source .env/bin/activate
          python3 compile.py

      - name: Upload macOS Intel
        uses: actions/upload-artifact@v6
        with:
          name: WorkSlopDesktop-macOS-Intel
          path: dist/WorkSlopDesktop-macOS-*.zip
          if-no-files-found: error
          archive: false

  build-macos-intel-legacy:
    if: ${{ github.event_name == 'push' || github.event.inputs.build_for_macos_intel_legacy == 'true' }}
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Create venv and install requirements
        run: |
          python3 -m venv .env
          source .env/bin/activate
          python -m pip install -U pip setuptools wheel
          pip install --no-binary sslpsk_pmd3 -r requirements-legacy.txt

      - name: Run offscreen tests
        run: |
          source .env/bin/activate
          python3 tools/run_offscreen_tests.py

      - name: Build zsign (sideload signing)
        run: python3 tools/build_zsign.py

      - name: Build macOS Intel Legacy
        run: |
          source .env/bin/activate
          python3 compile.py

      - name: Upload macOS Intel Legacy
        uses: actions/upload-artifact@v6
        with:
          name: WorkSlopDesktop-macOS-Intel-Legacy
          path: dist/WorkSlopDesktop-macOS-*.zip
          if-no-files-found: error
          archive: false

  build-macos-arm:
    if: ${{ github.event_name == 'push' || github.event.inputs.build_for_macos_arm == 'true' }}
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install OpenSSL
        run: |
          brew install openssl@3 pkgconf || true

      - name: Create venv and install requirements
        run: |
          python3 -m venv .env
          source .env/bin/activate
          python -m pip install -U pip setuptools wheel

          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          export CPPFLAGS="-I${OPENSSL_PREFIX}/include"
          export LDFLAGS="-L${OPENSSL_PREFIX}/lib"
          export PKG_CONFIG_PATH="${OPENSSL_PREFIX}/lib/pkgconfig"

          pip install --no-binary sslpsk_pmd3 -r requirements.txt

      - name: Run offscreen tests
        run: |
          source .env/bin/activate
          python3 tools/run_offscreen_tests.py

      - name: Build zsign (sideload signing)
        run: python3 tools/build_zsign.py

      - name: Build macOS ARM
        run: |
          source .env/bin/activate
          python3 compile.py

      - name: Upload macOS ARM
        uses: actions/upload-artifact@v6
        with:
          name: WorkSlopDesktop-macOS-ARM
          path: dist/WorkSlopDesktop-macOS-*.zip
          if-no-files-found: error
          archive: false

  build-windows:
    if: ${{ github.event_name == 'push' || github.event.inputs.build_for_windows == 'true' }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -r requirements.txt
          pip install pyuac

      - name: Run offscreen tests
        run: python tools/run_offscreen_tests.py

      - name: Set up MSBuild (for zsign)
        uses: microsoft/setup-msbuild@v2

      - name: Build zsign (sideload signing)
        shell: powershell
        run: |
          git clone --depth 1 https://github.com/zhlynn/zsign.git .zsign-build
          msbuild .zsign-build/build/windows/vs2022/zsign.sln /p:Configuration=Release /p:Platform=x64
          $exe = Get-ChildItem -Path .zsign-build -Recurse -Filter zsign.exe | Select-Object -First 1
          if (-not $exe) { throw "zsign.exe not produced by msbuild" }
          New-Item -ItemType Directory -Force -Path vendor | Out-Null
          Copy-Item $exe.FullName vendor/zsign.exe
          Remove-Item -Recurse -Force .zsign-build

      - name: Build Windows
        run: python compile.py

      - name: Upload Windows
        uses: actions/upload-artifact@v6
        with:
          name: WorkSlopDesktop-Windows
          path: dist/WorkSlopDesktop
          if-no-files-found: error

  build-linux:
    if: ${{ github.event_name == 'push' || github.event.inputs.build_for_linux == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libglib2.0-0 libdbus-1-3 libxcb-cursor0

      - name: Install dependencies
        run: |
          set -uo pipefail
          installed=0
          for attempt in 1 2 3 4; do
            if python -m pip install -U pip setuptools wheel \
              && pip install --retries 5 --timeout 60 -r requirements.txt; then
              installed=1
              break
            fi
            echo "::warning::dependency install failed (attempt $attempt/4) - retrying in 30s"
            sleep 30
          done
          if [ "$installed" -ne 1 ]; then
            echo "::error::requirements.txt still not installable after 4 attempts"
            exit 1
          fi
          pip check

      - name: Run offscreen tests
        run: python tools/run_offscreen_tests.py

      - name: Build zsign (sideload signing)
        run: python3 tools/build_zsign.py

      - name: Build Linux
        run: python compile.py

      - name: Upload Linux
        uses: actions/upload-artifact@v6
        with:
          name: WorkSlopDesktop-Linux
          path: dist/WorkSlopDesktop
          if-no-files-found: error

  build-linux-arm:
    if: ${{ github.event_name == 'push' || github.event.inputs.build_for_arm_linux == 'true' }}
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libglib2.0-0 libdbus-1-3 libxcb-cursor0

      - name: Install dependencies
        run: |
          set -uo pipefail
          installed=0
          for attempt in 1 2 3 4; do
            if python -m pip install -U pip setuptools wheel \
              && pip install --retries 5 --timeout 60 -r requirements.txt; then
              installed=1
              break
            fi
            echo "::warning::dependency install failed (attempt $attempt/4) - retrying in 30s"
            sleep 30
          done
          if [ "$installed" -ne 1 ]; then
            echo "::error::requirements.txt still not installable after 4 attempts"
            exit 1
          fi
          pip check

      - name: Run offscreen tests
        run: python tools/run_offscreen_tests.py

      - name: Build zsign (sideload signing)
        run: python3 tools/build_zsign.py

      - name: Build Linux ARM
        run: python compile.py

      - name: Upload Linux ARM
        uses: actions/upload-artifact@v6
        with:
          name: WorkSlopDesktop-Linux-ARM
          path: dist/WorkSlopDesktop
          if-no-files-found: error
